name: Rearmar recopilaciones sin portada

# Puntual (ver rebuild-compilations-without-intro.mjs): saca la portada "VIKEN HOME" de las 22
# recopilaciones viejas. Corre a las 05:00 ART (08:00 UTC, Argentina no tiene horario de verano)
# porque el 08/08 se topo con el limite diario de subidas de YouTube a mitad de camino. El script
# es idempotente (retoma por rebuild-state.json), asi que si vuelve a toparse con el limite no
# pasa nada, reintenta solo al dia siguiente a la misma hora.
#
# Una vez que el mail de resumen diga 22/22 completas, borrar este workflow -- ya cumplio su
# proposito puntual y no hace falta que seguir corriendo todos los dias.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rebuild-compilations
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Instalar ffmpeg y fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - run: node rebuild-compilations-without-intro.mjs --apply
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

      - name: Commit rebuild-state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rebuild-state.json
          git diff --cached --quiet || git commit -m "chore: actualizar rebuild-state.json [skip ci]"
          git push
